      /* Critical CSS - Inline for faster first paint */

      body{margin:0;font-family:'Outfit',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#000;color:#fff}
      #root{min-height:100vh}
      .loading-screen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:9999}
      .loading-spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top-color:#3b82f6;border-radius:50%;animation:spin 1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      /* Prevent FOIT - show text immediately with fallback font */
      h1,h2,h3,h4,h5,h6{font-family:'Outfit',system-ui,sans-serif;font-display:swap}
    </style>

  <body>
    <div id="root">
      <!-- Loading screen shown while JS loads -->
      <div class="loading-screen" id="loading-screen">
        <div class="loading-spinner"></div>
      </div>
    </div>
    <script>
      // Remove loading screen when app is ready
      window.addEventListener('load', function() {
        var loader = document.getElementById('loading-screen');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 0.3s';
          setTimeout(function() { loader.remove(); }, 300);
        }
      });
    </script>
